<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Mi Tierra Colorada</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
        }
        .product-edit-card {
            display: grid;
            grid-template-columns: 120px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: var(--transition);
        }
        .product-edit-card:hover {
            background: #fafafa;
        }
        .product-edit-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }
        .btn-sm {
            padding: 8px 20px;
            font-size: 0.8rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
        }
    </style>
</head>
<body style="background: var(--bg-cream)">

    <div class="admin-container" id="login-container" style="max-width: 400px; text-align: center; margin-top: 150px;">
        <img src="logo.jpeg" style="width: 80px; border-radius: 50%; margin-bottom: 20px;" alt="Logo">
        <h2 style="margin-bottom: 10px;">Acceso Restringido</h2>
        <p style="margin-bottom: 20px; color: #666;">Ingresa tus credenciales para administrar los productos.</p>
        <form id="loginForm">
            <input type="email" id="login-email" placeholder="Correo Electrónico" required>
            <input type="password" id="login-password" placeholder="Contraseña" required>
            <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
        </form>
        <p id="login-error" style="color: red; margin-top: 15px; display: none;">Credenciales incorrectas.</p>
        <div style="margin-top: 20px;">
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Volver al Sitio</a>
        </div>
    </div>

    <div class="admin-container" id="admin-container" style="display: none;">
        <div class="admin-header">
            <div>
                <img src="logo.jpeg" style="width: 60px; border-radius: 50%;" alt="Logo">
                <h2 style="display: inline-block; margin-left:15px; vertical-align: middle;">Mantenedor de Productos</h2>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-sm" onclick="showAddModal()">+ Nuevo Producto</button>
                <button class="btn btn-sm outline" style="border-color: #ff4d4d; color: #ff4d4d;" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>

        <div id="admin-product-list">
            <!-- Cargando productos... -->
        </div>
        
        <div style="margin-top: 40px; text-align: center;">
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Volver al Sitio</a>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Editar Producto</h3>
            <form id="productForm">
                <input type="hidden" id="edit-id">
                <label>Nombre del Producto</label>
                <input type="text" id="edit-nombre" required>
                
                <label>Precio ($)</label>
                <input type="number" id="edit-precio" placeholder="Ej: 3500" required>
                
                <label>Categoría</label>
                <select id="edit-categoria">
                    <option value="panaderia">Panadería</option>
                    <option value="mermeladas">Mermeladas</option>
                    <option value="conservas">Salsas y Conservas</option>
                </select>

                <label>Descripción</label>
                <textarea id="edit-descripcion" rows="3" required></textarea>

                <label>Tag (ej: Gourmet, Firma, Masa Madre)</label>
                <input type="text" id="edit-tag">

                <label>Imagen (nombre del archivo o URL)</label>
                <div style="display: flex; gap: 10px; align-items: center; margin: 10px 0 20px;">
                    <input type="text" id="edit-imagen" placeholder="ej: mi_imagen.jpg" style="flex: 1; margin: 0;">
                    <button type="button" class="btn outline" onclick="document.getElementById('edit-imagen-file').click()" style="margin: 0; padding: 12px 20px; white-space: nowrap;">Explorar...</button>
                    <input type="file" id="edit-imagen-file" accept="image/*" style="display: none;">
                </div>
                <div style="text-align: center; margin-bottom: 20px;">
                    <img id="edit-imagen-preview" src="" alt="Previsualización" style="max-width: 100px; max-height: 100px; border-radius: 10px; display: none; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn" style="flex: 2;">Guardar Cambios</button>
                    <button type="button" class="btn outline" style="flex: 1; border-color: #ccc; color: #666;" onclick="closeModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="admin.js?v=2"></script>
</body>
</html>
