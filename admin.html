<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel de Administración | Mi Tierra Colorada</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-cream, #FFFDF8);
            font-family: var(--font-body, 'Outfit', sans-serif);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .admin-container {
            max-width: 900px;
            margin: 20px auto 40px;
            padding: 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #8B4513;
            padding-bottom: 15px;
        }
        .admin-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-header-title img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }
        .admin-header-title h2 {
            margin: 0;
            font-family: var(--font-title, 'Playfair Display', serif);
            font-size: 1.35rem;
            color: #8B4513;
        }
        .admin-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }
        @media (min-width: 600px) {
            .admin-container {
                padding: 30px;
                margin: 40px auto;
            }
            .admin-header-title h2 {
                font-size: 1.6rem;
            }
            .admin-actions {
                width: auto;
            }
        }
        .search-bar {
            width: 100%;
            margin-bottom: 20px;
        }
        .product-edit-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #eee;
            background: #fff;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .product-edit-card:hover {
            border-color: #8B4513;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .product-card-top {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .product-edit-card img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: #f5f5f5;
        }
        .product-card-info {
            flex: 1;
            min-width: 0;
        }
        .product-card-info h4 {
            margin: 0 0 4px;
            font-size: 1.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-card-info .meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-active {
            background-color: #E8F5E9;
            color: #2E7D32;
        }
        .badge-inactive {
            background-color: #FFEBEE;
            color: #C62828;
        }
        .product-card-actions {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .product-card-actions button {
            flex: 1;
        }
        @media (min-width: 600px) {
            .product-edit-card {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 16px 20px;
            }
            .product-card-top {
                flex: 1;
            }
            .product-edit-card img {
                width: 80px;
                height: 80px;
            }
            .product-card-actions {
                width: auto;
                flex-shrink: 0;
            }
            .product-card-actions button {
                flex: initial;
            }
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            text-decoration: none;
            background-color: #8B4513;
            color: white;
            min-height: 42px;
        }
        .btn:hover {
            background-color: #6d360e;
        }
        .btn.outline {
            background-color: transparent;
            border-color: #8B4513;
            color: #8B4513;
        }
        .btn.outline:hover {
            background-color: #8B4513;
            color: white;
        }
        .btn-sm {
            padding: 8px 14px;
            font-size: 0.85rem;
            min-height: 36px;
        }
        .btn-danger {
            border-color: #e53935 !important;
            color: #e53935 !important;
        }
        .btn-danger:hover {
            background-color: #e53935 !important;
            color: white !important;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            z-index: 1001;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
            overflow-y: auto;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            margin: 20px auto 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .modal-header h3 {
            margin: 0;
            font-family: var(--font-title, 'Playfair Display', serif);
            color: #8B4513;
            font-size: 1.3rem;
        }
        .close-modal-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
            padding: 4px;
            line-height: 1;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 4px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px; /* Evita zoom automático en iOS */
            background-color: #fafafa;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #8B4513;
            background-color: white;
            box-shadow: 0 0 0 2px rgba(139,69,19,0.1);
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div class="admin-container" id="login-container" style="max-width: 400px; text-align: center; margin-top: 60px;">
        <img src="logo.jpeg" style="width: 70px; border-radius: 50%; margin-bottom: 15px;" alt="Logo">
        <h2 style="margin: 0 0 10px; font-family: var(--font-title, 'Playfair Display', serif); color: #8B4513;">Acceso Administrador</h2>
        <p style="margin-bottom: 20px; color: #666; font-size: 0.9rem;">Ingresa tus credenciales para gestionar el catálogo de productos.</p>
        <form id="loginForm">
            <input type="email" id="login-email" placeholder="Correo Electrónico" required>
            <input type="password" id="login-password" placeholder="Contraseña" required>
            <button type="submit" class="btn" style="width: 100%;">Ingresar al Panel</button>
        </form>
        <p id="login-error" style="color: #e53935; margin-top: 15px; font-size: 0.9rem; display: none;">Credenciales incorrectas.</p>
        <div style="margin-top: 20px;">
            <a href="index.html" style="color: #8B4513; text-decoration: none; font-weight: 600; font-size: 0.9rem;">← Volver a la Tienda</a>
        </div>
    </div>

    <!-- Panel de Gestión -->
    <div class="admin-container" id="admin-container" style="display: none;">
        <div class="admin-header">
            <div class="admin-header-title">
                <img src="logo.jpeg" alt="Logo">
                <div>
                    <h2>Mantenedor de Productos</h2>
                    <small style="color: #666;">Catálogo en Vivo</small>
                </div>
            </div>
            <div class="admin-actions">
                <button class="btn btn-sm" onclick="showAddModal()">+ Nuevo Producto</button>
                <button class="btn btn-sm outline btn-danger" onclick="logout()">Salir</button>
            </div>
        </div>

        <!-- Buscador rápido en móvil -->
        <input type="text" id="admin-search-input" class="search-bar" placeholder="🔍 Buscar producto por nombre o categoría..." style="margin-bottom: 15px;">

        <div id="admin-product-list">
            <!-- Cargando productos... -->
        </div>
        
        <div style="margin-top: 30px; text-align: center;">
            <a href="index.html" style="color: #8B4513; text-decoration: none; font-weight: 600;">← Ir a la Tienda Online</a>
        </div>
    </div>

    <!-- Modal de Edición / Creación -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Editar Producto</h3>
                <button type="button" class="close-modal-btn" onclick="closeModal()" aria-label="Cerrar">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="edit-id">
                
                <label for="edit-activo">Estado de Vigencia en la Tienda</label>
                <select id="edit-activo" style="font-weight: 600;">
                    <option value="true">✅ Vigente (Visible y disponible para comprar)</option>
                    <option value="false">⛔ No Vigente (Oculto en el catálogo web)</option>
                </select>

                <label for="edit-nombre">Nombre del Producto</label>
                <input type="text" id="edit-nombre" placeholder="Ej: Dúo Semilla" required>
                
                <label for="edit-precio">Precio al Público ($)</label>
                <input type="number" id="edit-precio" placeholder="Ej: 3500" required>
                
                <label for="edit-categoria">Categoría</label>
                <select id="edit-categoria">
                    <option value="panaderia">🥖 Panadería Artesanal</option>
                    <option value="mermeladas">🍓 Mermeladas Gourmet</option>
                    <option value="conservas">🧄 Salsas y Conservas</option>
                </select>

                <label for="edit-descripcion">Descripción</label>
                <textarea id="edit-descripcion" rows="3" placeholder="Detalles, peso, ingredientes..." required></textarea>

                <label for="edit-tag">Etiqueta destacada (Tag)</label>
                <input type="text" id="edit-tag" placeholder="Ej: Masa Madre, Gourmet, Firma">

                <label>Foto del Producto</label>
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
                    <input type="text" id="edit-imagen" placeholder="URL o nombre de archivo" style="flex: 1; margin-bottom: 0;">
                    <button type="button" class="btn btn-sm outline" onclick="document.getElementById('edit-imagen-file').click()" style="margin: 0; padding: 10px 14px; white-space: nowrap;">📷 Subir Foto</button>
                    <input type="file" id="edit-imagen-file" accept="image/*" style="display: none;">
                </div>
                <div style="text-align: center; margin-bottom: 16px;">
                    <img id="edit-imagen-preview" src="" alt="Previsualización" style="max-width: 90px; max-height: 90px; border-radius: 8px; display: none; object-fit: cover; border: 1px solid #ddd;">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn" style="flex: 2;">Guardar Cambios</button>
                    <button type="button" class="btn outline" style="flex: 1; border-color: #ccc; color: #666;" onclick="closeModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="admin.js?v=3"></script>
</body>
</html>
